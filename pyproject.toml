[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "madnlab"
version = "0.1.0"
description = "A measurement engine for optional rules and movement strategies in Mensch aergere Dich nicht"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
analysis = ["numpy>=1.26", "scipy>=1.11"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
madnlab = "madnlab.run.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/madnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# The engine review found one signature that drifted out of sync with its
# callers during a refactor, in the module where NF-1's determinism claims are
# made. A type checker removes that error class for free.
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# The docs and docstrings quote the specification, which uses en dashes for
# section ranges and German rule text with typographic quotation marks. Those
# are deliberate, not confusables that slipped in.
ignore = ["RUF002", "RUF003"]
