[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "madnlab"
version = "0.1.0"
description = "A measurement engine for optional rules and movement strategies in Mensch aergere Dich nicht"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.11"]

[project.scripts]
madnlab = "madnlab.run.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/madnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

# A type checker removes the class of error where a signature and its callers
# drift apart, which matters most in the modules that carry the determinism
# claims.
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# Strict typing earns its keep in the engine, where a signature that drifts out
# of sync with its callers is invisible until it produces a wrong game. In the
# tests the same drift is caught by running them, so requiring an annotation on
# every scenario function would add noise without adding a check. Everything
# else stays strict here too, including the return types of the helpers the
# scenarios share.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# The docs and docstrings quote the specification, which uses en dashes for
# section ranges and German rule text with typographic quotation marks. Those
# are deliberate, not confusables that slipped in.
ignore = ["RUF002", "RUF003"]
